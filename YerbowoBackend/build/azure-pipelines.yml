trigger:
  - develop

variables:
  - name: buildConfiguration
    value: 'Release'
  - name: dotnetSdkVersion
    value: '8.x'

pool:
  vmImage: 'windows-latest'

steps:
- task: AzureKeyVault@2
  displayName: 'Download secrets from Azure Key Vault'
  inputs:
    azureSubscription: 'Azure subscription key vault'
    KeyVaultName: 'yerbowo-key-vault'
    SecretsFilter: '*'
    RunAsPreJob: true

- task: UseDotNet@2
  displayName: 'Use .NET SDK $(dotnetSdkVersion)'
  inputs:
    version: '$(dotnetSdkVersion)'

- task: DotNetCoreCLI@2
  displayName: 'Restore project dependencies'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

- task: DotNetCoreCLI@2
  displayName: 'Build project - $(buildConfiguration)'
  inputs:
    command: 'build'
    arguments: '--no-restore --configuration $(buildConfiguration)'
    projects: '**/*.csproj'

- task: PowerShell@2
  displayName: 'Run all tests with Key Vault environment variables'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Setting environment variables..."
      $env:AZURE_KEYVAULT_URL = "$(KeyVaultConfig--KVUrl)"
      $env:AZURE_CLIENT_ID = "$(KeyVaultConfig--ClientId)"
      $env:AZURE_CLIENT_SECRET = "$(KeyVaultConfig--ClientSecret)"
      $env:AZURE_TENANT_ID = "$(KeyVaultConfig--TenantId)"

      $testProjects = Get-ChildItem -Path "$(Build.SourcesDirectory)" -Recurse -Filter *.Tests.csproj

      foreach ($proj in $testProjects) {
          Write-Host "Running tests in $($proj.FullName)..."

          dotnet test "$($proj.FullName)" `
            --no-build `
            --configuration Release `
            --collect:"Code Coverage" `
            --settings "$(Build.SourcesDirectory)\YerbowoBackend\.runsettings"
      }

- task: PublishCodeCoverageResults@1
  displayName: 'Publish code coverage report'
  inputs:
    codeCoverageTool: 'Cobertura'
    summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'

- task: DotNetCoreCLI@2
  displayName: 'Publish project'
  inputs:
    command: publish
    arguments: '--configuration $(buildConfiguration) --output $(build.artifactstagingdirectory)'
    zipAfterPublish: false

# Angular frontend
- task: NodeTool@0
  displayName: 'Use Node 18.x'
  inputs:
    versionSpec: 18.x

- task: Npm@1
  displayName: 'npm install'
  inputs:
    workingDir: YerbowoFrontend
    verbose: false

- task: Npm@1
  displayName: 'Build Angular'
  inputs:
    command: custom
    workingDir: YerbowoFrontend
    verbose: false
    customCommand: 'run production'

- task: CopyFiles@2
  displayName: 'Copy Angular files to wwwroot'
  inputs:
    SourceFolder: YerbowoFrontend/dist/yerbowo
    TargetFolder: '$(build.artifactstagingdirectory)/Yerbowo.Api/wwwroot'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: drop'
  inputs:
    PathtoPublish: '$(Build.artifactStagingDirectory)'
