trigger:
  branches:
    exclude:
      - '*'

resources:
  pipelines:
    - pipeline: yerbowo_ci
      source: yerbowo-ci
      trigger:
        branches:
          include:
            - develop

pool:
  vmImage: ubuntu-latest

variables:
  -group: docker-hub-auth
  containerAppName: yerbowo-app-container
  resourceGroup: yerbowo
  containerImage: 'wojtuchny/yerbowo-app:latest'

steps:
- task: AzureCLI@2
  displayName: 'Login to Docker Hub registry'
  inputs:
    azureSubscription: 'azure-resource-manager-yerbowo'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az containerapp registry set \
        --name $(containerAppName) \
        --resource-group $(resourceGroup) \
        --server index.docker.io \
        --username $(dockerHubUsername) \
        --password $(dockerHubToken)
- task: AzureCLI@2
  displayName: 'Deploy to Azure Container App'
  inputs:
    azureSubscription: 'azure-resource-manager-yerbowo'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "Deploying image $(containerImage) to Azure Container App $(containerAppName)..."
      az config set extension.use_dynamic_install=yes_without_prompt

      az containerapp update \
        --name $(containerAppName) \
        --resource-group $(resourceGroup) \
        --image $(containerImage)
